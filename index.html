<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master DOM Arcade: O Jogo de Aprendizado</title>
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between py-6 px-4">

    <!-- Cabeçalho do Jogo -->
    <header class="max-w-2xl w-full mx-auto flex items-center justify-between text-white mb-4">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🌳</span>
            <h1 class="text-xl sm:text-2xl font-black tracking-wide">DOM Arcade</h1>
        </div>
        <div class="flex items-center gap-4 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 text-sm font-bold">
            <div>🔥 Acertos: <span id="scoreCount" class="text-emerald-400">0</span></div>
            <div>⚡ Questão: <span id="currentQuestionNum">1</span>/15</div>
        </div>
    </header>

    <!-- Barra de Progresso -->
    <div class="max-w-2xl w-full mx-auto bg-white/20 rounded-full h-3 mb-6 overflow-hidden border border-white/10">
        <div id="progressBar" class="bg-emerald-400 h-full w-[6.66%] transition-all duration-300 rounded-full"></div>
    </div>

    <!-- Tela Principal do Jogo (Card da Pergunta) -->
    <main class="max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100 flex-1 flex flex-col justify-between animate-pop" id="gameCard">
        
        <div>
            <!-- Categoria/Nível -->
            <div class="flex justify-between items-center mb-4">
                <span id="questionBadge" class="bg-blue-100 text-blue-800 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">Fundamentos</span>
                <span class="text-xs font-semibold text-slate-400">Modo Jogo Interativo</span>
            </div>

            <!-- Título da Pergunta -->
            <h2 id="questionTitle" class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-snug">
                Carregando pergunta...
            </h2>

            <!-- Opções de Resposta -->
            <div id="optionsContainer" class="space-y-3">
                <!-- Injetadas dinamicamente via JS -->
            </div>
        </div>

        <!-- Área de Feedback e Justificativa (inicialmente oculta) -->
        <div id="feedbackSection" class="hidden mt-6 pt-4 border-t border-slate-100">
            <div id="feedbackHeader" class="font-black text-lg mb-1"></div>
            <p id="feedbackText" class="text-sm sm:text-base text-slate-600 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200"></p>
            <button id="nextBtn" class="mt-4 w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 text-base flex items-center justify-center gap-2">
                Próxima Pergunta ➡️
            </button>
        </div>

    </main>

    <!-- Tela de Conclusão (Oculta por padrão) -->
    <div id="completionScreen" class="hidden max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-2xl p-8 sm:p-12 text-center animate-pop my-auto">
        <div class="text-6xl mb-4" id="completionEmoji">🏆</div>
        <h2 class="text-3xl font-black text-slate-900 mb-2">Missão Concluída!</h2>
        <p class="text-slate-600 mb-6 text-lg" id="completionMessage">Você completou o desafio do DOM com sucesso.</p>
        
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-6 mb-8 max-w-xs mx-auto">
            <div class="text-sm font-semibold text-blue-600 uppercase tracking-wider">Pontuação Final</div>
            <div class="text-4xl font-black text-blue-900 mt-1"><span id="finalScore">0</span> / 15</div>
        </div>

        <button id="restartGameBtn" class="w-full max-w-md mx-auto py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-xl transition transform active:scale-95 text-lg flex items-center justify-center gap-2">
            Jogar Novamente 🔄
        </button>
    </div>

    <!-- Rodapé -->
    <footer class="text-center text-white/60 text-xs mt-6">
        Master DOM Arcade • Aprenda JavaScript manipulando o DOM em tempo real
    </footer>

    <!-- Lógica do Jogo -->
    <script>
        const questions = [
            {
                badge: "Fundamentos",
                title: "1. O que significa a sigla DOM?",
                options: [
                    { text: "Document Object Model", correct: true, justification: "Correto! DOM significa Document Object Model (Modelo de Objeto de Documento), a interface que permite ao JavaScript interagir estruturalmente com as páginas web." },
                    { text: "Data Object Management", correct: false, justification: "Incorreto. A sigla correta é Document Object Model." },
                    { text: "Digital Ordered Mainframe", correct: false, justification: "Incorreto. Refere-se a Document Object Model." }
                ]
            },
            {
                badge: "Fundamentos",
                title: "2. Qual é o objeto global fornecido pelo navegador que serve como ponto de entrada para o DOM?",
                options: [
                    { text: "window.dom", correct: false, justification: "Incorreto. O objeto global padrão acessível na árvore é o `document`." },
                    { text: "document", correct: true, justification: "Correto! O objeto global `document` representa toda a página web carregada no navegador e é o ponto de partida absoluto para consultas." },
                    { text: "html", correct: false, justification: "Incorreto. O objeto correto é `document`." }
                ]
            },
            {
                badge: "Seletores",
                title: "3. Qual método seleciona APENAS o primeiro elemento correspondente a um seletor CSS específico?",
                options: [
                    { text: "document.querySelectorAll()", correct: false, justification: "Incorreto. `querySelectorAll` retorna uma lista com todos os elementos correspondentes." },
                    { text: "document.querySelector()", correct: true, justification: "Correto! O `document.querySelector()` retorna estritamente o primeiro elemento que corresponde ao seletor CSS fornecido." },
                    { text: "document.getElementBySelector()", correct: false, justification: "Incorreto. Este método não existe na API padrão do DOM." }
                ]
            },
            {
                badge: "Seletores",
                title: "4. Para selecionar todos os elementos com a classe 'item', qual sintaxe está correta?",
                options: [
                    { text: "document.querySelectorAll('item')", correct: false, justification: "Incorreto. Faltou o ponto indicador de classe." },
                    { text: "document.getElementById('.item')", correct: false, justification: "Incorreto. `getElementById` busca apenas por ID único sem o ponto." },
                    { text: "document.querySelectorAll('.item')", correct: true, justification: "Correto! O seletor de classe requer o ponto (`.item`) e `querySelectorAll` retorna todos os elementos correspondentes." }
                ]
            },
            {
                badge: "Manipulação",
                title: "5. Qual propriedade modifica de forma segura o texto visível de um nó, sem interpretar tags HTML?",
                options: [
                    { text: "textContent", correct: true, justification: "Correto! `textContent` altera ou lê exclusivamente o texto bruto do nó de forma segura, ignorando códigos HTML maliciosos." },
                    { text: "innerHTML", correct: false, justification: "Incorreto. `innerHTML` interpreta marcações HTML ativamente." },
                    { text: "value", correct: false, justification: "Incorreto. `value` é utilizado em campos de formulários." }
                ]
            },
            {
                badge: "Manipulação",
                title: "6. O que acontece ao usar a propriedade innerHTML = '<strong>Olá</strong>' em um elemento?",
                options: [
                    { text: "Escreve o texto puro incluindo as tags de forma literal na tela.", correct: false, justification: "Incorreto. Isso ocorre com o textContent." },
                    { text: "Renderiza a palavra 'Olá' em negrito, interpretando o HTML.", correct: true, justification: "Correto! `innerHTML` interpreta a string enviada como marcação HTML real, transformando a tag `<strong>` em negrito visual." },
                    { text: "Apaga o elemento inteiro do documento por segurança.", correct: false, justification: "Incorreto. O elemento permanece, tendo seu conteúdo interno substituído." }
                ]
            },
            {
                badge: "Estilos",
                title: "7. Qual propriedade do elemento usamos para alterar diretamente propriedades CSS individuais (ex: cor de fundo)?",
                options: [
                    { text: "element.css", correct: false, justification: "Incorreto. A propriedade `.css` não existe nativamente para estilos inline." },
                    { text: "element.style", correct: true, justification: "Correto! A propriedade `.style` dá acesso direto ao estilo inline do elemento para manipulação individual de propriedades visuais." },
                    { text: "element.class", correct: false, justification: "Incorreto. Para classes usamos `className` ou `classList`." }
                ]
            },
            {
                badge: "Estilos",
                title: "8. Como se escreve a propriedade CSS background-color ao manipulá-la via JavaScript?",
                options: [
                    { text: "backgroundColor (CamelCase)", correct: true, justification: "Correto! No JavaScript, propriedades compostas do CSS perdem o hífen e passam a ser escritas em formato CamelCase (`backgroundColor`)." },
                    { text: "background-color (Igual ao CSS)", correct: false, justification: "Incorreto. O hífen causaria um erro de sintaxe de operador de subtração no JS." },
                    { text: "BackgroundColor (Primeira maiúscula)", correct: false, justification: "Incorreto. A primeira letra deve ser minúscula (camelCase)." }
                ]
            },
            {
                badge: "Criação de Nós",
                title: "9. Qual método cria um novo elemento HTML na memória (ex: uma nova tag 'p'), antes de inseri-lo na página?",
                options: [
                    { text: "document.newElement('p')", correct: false, justification: "Incorreto. Este método não faz parte da especificação." },
                    { text: "document.createElement('p')", correct: true, justification: "Correto! `document.createElement('tag')` instancia um novo elemento na memória do navegador antes de ele ser inserido na árvore visível." },
                    { text: "document.appendElement('p')", correct: false, justification: "Incorreto. O método de inclusão é o appendChild." }
                ]
            },
            {
                badge: "Criação de Nós",
                title: "10. Qual método adiciona um nó filho ao final da lista de filhos de um elemento pai?",
                options: [
                    { text: "parentElement.appendChild(childNode)", correct: true, justification: "Correto! `appendChild()` insere um nó criado como o último filho do elemento pai especificado." },
                    { text: "parentElement.insertChild(childNode)", correct: false, justification: "Incorreto. A nomenclatura correta utiliza appendChild." },
                    { text: "parentElement.addToEnd(childNode)", correct: false, justification: "Incorreto. Este método não existe na API padrão." }
                ]
            },
            {
                badge: "Remoção",
                title: "11. Como você remove permanentemente um elemento selecionado do DOM?",
                options: [
                    { text: "elemento.delete()", correct: false, justification: "Incorreto. `delete` é um operador para propriedades de objetos." },
                    { text: "elemento.clear()", correct: false, justification: "Incorreto. Não é o método padrão de exclusão de nós." },
                    { text: "elemento.remove()", correct: true, justification: "Correto! O método `.remove()` exclui diretamente o elemento selecionado da árvore do DOM de forma limpa." }
                ]
            },
            {
                badge: "Eventos",
                title: "12. Qual método é utilizado para escutar e reagir a eventos (como cliques, envios de formulário, teclas)?",
                options: [
                    { text: "element.addEventListener()", correct: true, justification: "Correto! `addEventListener()` é a forma moderna, recomendada e flexível de registrar ouvintes de eventos em elementos." },
                    { text: "element.onEvent()", correct: false, justification: "Incorreto. Eventos inline legados usam prefixos como `onclick`, mas o método padrão de escuta é outro." },
                    { text: "element.listen()", correct: false, justification: "Incorreto. `listen` não pertence à API nativa do DOM." }
                ]
            },
            {
                badge: "Classes",
                title: "13. Como você pode adicionar ou remover dinamicamente uma classe CSS de um elemento com facilidade?",
                options: [
                    { text: "element.classNameList", correct: false, justification: "Incorreto. A nomenclatura correta é classList." },
                    { text: "element.classList (com add, remove, toggle)", correct: true, justification: "Correto! `classList` fornece métodos práticos como `.add()`, `.remove()` e `.toggle()` para gerenciar classes CSS de forma limpa." },
                    { text: "element.cssList", correct: false, justification: "Incorreto. A propriedade correta gerencia classes e não estilos gerais de css." }
                ]
            },
            {
                badge: "Formulários",
                title: "14. Qual propriedade obtém ou define o valor inserido em um campo de formulário (<input>)?",
                options: [
                    { text: "textContent", correct: false, justification: "Incorreto. `textContent` lê o texto de nós de texto normais, não o valor de inputs." },
                    { text: "innerHTML", correct: false, justification: "Incorreto. Inputs não possuem conteúdo HTML interno renderizável dessa forma." },
                    { text: "value", correct: true, justification: "Correto! A propriedade `.value` obtém ou define o conteúdo atual inserido em campos interativos como inputs, textareas e selects." }
                ]
            },
            {
                badge: "Arquitetura",
                title: "15. O que significa quando dizemos que o DOM possui uma estrutura de 'Árvore' (Tree)?",
                options: [
                    { text: "Que o código precisa ser executado ao ar livre em servidores remotos.", correct: false, justification: "Incorreto. Nada tem a ver com infraestrutura física." },
                    { text: "Que os elementos se organizam em nós pais, filhos e irmãos hierarquicamente.", correct: true, justification: "Correto! O DOM modela a página como uma árvore hierárquica formada por nós conectados a partir de uma raiz (document), ramificando pais, filhos e irmãos." },
                    { text: "Que o arquivo precisa obrigatoriamente ter extensão .tree.", correct: false, justification: "Incorreto. Arquivos HTML mantêm a extensão padrão .html." }
                ]
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answeredCurrent = false;

        const scoreCountEl = document.getElementById('scoreCount');
        const currentQuestionNumEl = document.getElementById('currentQuestionNum');
        const progressBarEl = document.getElementById('progressBar');
        const questionBadgeEl = document.getElementById('questionBadge');
        const questionTitleEl = document.getElementById('questionTitle');
        const optionsContainerEl = document.getElementById('optionsContainer');
        const feedbackSectionEl = document.getElementById('feedbackSection');
        const feedbackHeaderEl = document.getElementById('feedbackHeader');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const gameCard = document.getElementById('gameCard');
        const completionScreen = document.getElementById('completionScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const restartGameBtn = document.getElementById('restartGameBtn');

        function loadQuestion() {
            answeredCurrent = false;
            feedbackSectionEl.classList.add('hidden');
            
            const q = questions[currentIndex];
            questionBadgeEl.textContent = q.badge;
            questionTitleEl.textContent = q.title;
            currentQuestionNumEl.textContent = currentIndex + 1;
            
            // Atualizar barra de progresso
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            optionsContainerEl.innerHTML = '';
            
            // Embaralhar as opções visualmente para dar mais dinamismo de jogo
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "w-full text-left p-4 sm:p-4 rounded-xl border-2 border-slate-200 bg-slate-50 hover:bg-blue-50 hover:border-blue-300 font-semibold text-slate-700 transition transform active:scale-98 flex items-center justify-between text-sm sm:text-base";
                btn.innerHTML = `<span>${opt.text}</span> <span class="text-slate-300 font-normal">Selecionar</span>`;
                
                btn.addEventListener('click', () => {
                    if (answeredCurrent) return; // Evita duplo clique
                    answeredCurrent = true;
                    selectOption(opt, btn, q.options);
                });

                optionsContainerEl.appendChild(btn);
            });
        }

        function selectOption(selectedOpt, selectedButton, allOptions) {
            const allOptionButtons = optionsContainerEl.querySelectorAll('button');
            
            // Desativar todos os botões após a seleção
            allOptionButtons.forEach(b => b.disabled = true);

            if (selectedOpt.correct) {
                score++;
                scoreCountEl.textContent = score;
                selectedButton.className = "w-full text-left p-4 sm:p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-900 flex items-center justify-between text-sm sm:text-base shadow-sm";
                selectedButton.querySelector('span:last-child').textContent = "Correto! 🎯";
                selectedButton.querySelector('span:last-child').className = "text-emerald-600 font-bold";
                
                feedbackHeaderEl.textContent = "🎉 Resposta Correta!";
                feedbackHeaderEl.className = "font-black text-lg mb-1 text-emerald-600";
            } else {
                selectedButton.className = "w-full text-left p-4 sm:p-4 rounded-xl border-2 border-rose-500 bg-rose-50 font-bold text-rose-900 flex items-center justify-between text-sm sm:text-base shadow-sm animate-shake";
                selectedButton.querySelector('span:last-child').textContent = "Incorreto ❌";
                selectedButton.querySelector('span:last-child').className = "text-rose-600 font-bold";

                // Destacar qual era a correta
                allOptionButtons.forEach(b => {
                    const textSpan = b.querySelector('span:first-child').textContent;
                    const match = allOptions.find(o => o.text === textSpan);
                    if (match && match.correct) {
                        b.className = "w-full text-left p-4 sm:p-4 rounded-xl border-2 border-emerald-400 bg-emerald-50/50 font-bold text-emerald-900 flex items-center justify-between text-sm sm:text-base";
                    }
                });

                feedbackHeaderEl.textContent = "💡 Resposta Incorreta";
                feedbackHeaderEl.className = "font-black text-lg mb-1 text-rose-600";
            }

            feedbackTextEl.textContent = selectedOpt.justification;
            feedbackSectionEl.classList.remove('hidden');
            feedbackSectionEl.scrollIntoView({ behavior: 'smooth' });
        }

        nextBtn.addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
                gameCard.scrollIntoView({ behavior: 'smooth' });
            } else {
                showCompletionScreen();
            }
        });

        function showCompletionScreen() {
            gameCard.classList.add('hidden');
            document.querySelector('header').classList.add('hidden');
            progressBarEl.parentElement.classList.add('hidden');
            
            finalScoreEl.textContent = score;
            
            const completionEmoji = document.getElementById('completionEmoji');
            const completionMessage = document.getElementById('completionMessage');

            if (score === 15) {
                completionEmoji.textContent = "🏆👑";
                completionMessage.textContent = "Perfeito! Você gabaritou todas as 15 questões e é um verdadeiro Mestre do DOM!";
            } else if (score >= 10) {
                completionEmoji.textContent = "🌟🎉";
                completionMessage.textContent = `Excelente trabalho! Você acertou ${score} de 15 questões. Seu conhecimento de DOM está incrível.`;
            } else {
                completionEmoji.textContent = "💡🚀";
                completionMessage.textContent = `Você concluiu o desafio com ${score} acertos! Continue praticando para masterizar todos os conceitos do DOM.`;
            }

            completionScreen.classList.remove('hidden');
            completionScreen.scrollIntoView({ behavior: 'smooth' });
        }

        restartGameBtn.addEventListener('click', () => {
            currentIndex = 0;
            score = 0;
            scoreCountEl.textContent = 0;
            completionScreen.classList.add('hidden');
            gameCard.classList.remove('hidden');
            document.querySelector('header').classList.remove('hidden');
            progressBarEl.parentElement.classList.remove('hidden');
            loadQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Inicializar o jogo ao carregar
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
